<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Nihal Singh Rai, automation developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#262b38"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- background + dot grid -->
  <rect width="1200" height="360" fill="#07090d"/>
  <rect width="1200" height="360" fill="url(#dots)"/>
  <rect x="8" y="8" width="1184" height="344" fill="none" stroke="#e4e6ea" stroke-width="4"/>

  <!-- title block: hard offset shadow + card -->
  <rect x="74" y="74" width="700" height="170" fill="#86a8ff" stroke="#07090d" stroke-width="6"/>
  <rect x="60" y="60" width="700" height="170" fill="#e4e6ea" stroke="#07090d" stroke-width="6"/>
  <text x="90" y="150" font-family="'Arial Black', Impact, sans-serif" font-size="56" font-weight="900" fill="#07090d">NIHAL SINGH RAI</text>
  <text x="90" y="196" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#07090d">automation developer / agentic AI builder</text>

  <!-- status card -->
  <rect x="804" y="74" width="350" height="170" fill="#86a8ff"/>
  <rect x="790" y="60" width="350" height="170" fill="#10131a" stroke="#e4e6ea" stroke-width="4"/>
  <circle cx="820" cy="98" r="6" fill="#86a8ff"/>
  <text x="834" y="104" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#86a8ff">AVAILABLE FOR WORK</text>
  <text x="814" y="148" font-family="'Arial Black', Impact, sans-serif" font-size="26" fill="#e4e6ea">Open to automation</text>
  <text x="814" y="178" font-family="'Arial Black', Impact, sans-serif" font-size="26" fill="#e4e6ea">&amp; AI agent work</text>
  <rect x="814" y="192" width="12" height="20" fill="#86a8ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- stack tags: hard shadow + box -->
  <g font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#86a8ff" text-anchor="middle">
    <rect x="65" y="267" width="60" height="44" fill="#86a8ff"/>
    <rect x="60" y="262" width="60" height="44" fill="#10131a" stroke="#e4e6ea" stroke-width="3"/>
    <text x="90" y="289">n8n</text>

    <rect x="143" y="267" width="90" height="44" fill="#86a8ff"/>
    <rect x="138" y="262" width="90" height="44" fill="#10131a" stroke="#e4e6ea" stroke-width="3"/>
    <text x="183" y="289">Python</text>

    <rect x="251" y="267" width="110" height="44" fill="#86a8ff"/>
    <rect x="246" y="262" width="110" height="44" fill="#10131a" stroke="#e4e6ea" stroke-width="3"/>
    <text x="301" y="289">Supabase</text>

    <rect x="379" y="267" width="130" height="44" fill="#86a8ff"/>
    <rect x="374" y="262" width="130" height="44" fill="#10131a" stroke="#e4e6ea" stroke-width="3"/>
    <text x="439" y="289">PostgreSQL</text>

    <rect x="527" y="267" width="130" height="44" fill="#86a8ff"/>
    <rect x="522" y="262" width="130" height="44" fill="#10131a" stroke="#e4e6ea" stroke-width="3"/>
    <text x="587" y="289">Gemini API</text>

    <rect x="675" y="267" width="150" height="44" fill="#86a8ff"/>
    <rect x="670" y="262" width="150" height="44" fill="#10131a" stroke="#e4e6ea" stroke-width="3"/>
    <text x="745" y="289">WhatsApp API</text>
  </g>

  <!-- animated film grain: jittered in discrete steps -->
  <rect x="-40" y="-40" width="1280" height="440" filter="url(#grain)" opacity="0.16">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-12 7;9 -11;-6 14;14 4;-9 -5;5 12;0 0"
      dur="0.9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
</svg>
